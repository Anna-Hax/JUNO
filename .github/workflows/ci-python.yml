name: CI Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/core
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: Alembic upgrade head
        env:
          JUNO_DATA_DIR: ${{ runner.temp }}/juno-ci-data
        run: uv run alembic upgrade head

      - name: Pytest
        env:
          EMBEDDING_BACKEND: stub
        run: uv run pytest -q
